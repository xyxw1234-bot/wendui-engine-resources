<!doctype html><html class="login-locked" lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>登录｜节点引擎</title><link rel="stylesheet" href="/wendui-engine-resources/assets/site.css"></head><body class="login-page official-login"><div class="bg"></div><header class="topbar"><nav class="nav"><a class="brand" href="/wendui-engine-resources/"><div class="mark">问</div><div><h1>节点引擎</h1><p>教师 AI 工作流引擎</p></div></a><div class="links"><a href="/wendui-engine-resources/">概览</a><a href="/wendui-engine-resources/production/">养马创作</a><a href="/wendui-engine-resources/resources/">产品成果</a><a href="/wendui-engine-resources/me/">登录</a></div></nav></header><main class="official-login-stage"><section class="official-login-card"><div class="official-login-copy"><span class="kicker">教师登录</span><h2>登录节点引擎</h2><p>进入个人创作通道、产品成果和组织管理。</p><div class="login-capabilities"><span>生产任务</span><span>成果管理</span><span>组织管理</span></div></div><div class="official-login-form"><div class="login-tabs compact-tabs"><button class="active" onclick="switchLogin('phone',this)">手机验证码</button><button onclick="switchLogin('wechat',this)">微信扫码</button></div><div id="phoneLogin" class="login-pane show"><label>手机号</label><div class="code-row compact"><input id="phone" value="18193185960" placeholder="请输入手机号" inputmode="numeric" aria-label="手机号"><button class="btn ghost" onclick="fillCode()">获取验证码</button></div><label>验证码</label><input id="code" value="123456" placeholder="请输入验证码" inputmode="numeric" aria-label="验证码"><button class="btn primary wide login-submit" onclick="return WenduiDoLogin(event)">登录并继续</button><div class="result" id="loginResult"></div></div><div id="wechatLogin" class="login-pane"><div class="qr-large formal"><div class="qr-box"></div><p>使用微信扫码登录</p></div><button class="btn primary wide login-submit" onclick="return WenduiDoLogin(event)">确认扫码登录</button></div></div></section></main><script src="/wendui-engine-resources/assets/auth.js"></script><script src="/wendui-engine-resources/assets/org.js"></script><script>function switchLogin(id,btn){document.querySelectorAll('.login-tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.login-pane').forEach(p=>p.classList.remove('show'));document.getElementById(id+'Login').classList.add('show')}function fillCode(){const phone=document.getElementById('phone');const code=document.getElementById('code');const r=document.getElementById('loginResult');if(!phone.value.trim()){r.className='result show bad';r.textContent='请先输入手机号。';return;}code.value='123456';r.className='result show ok';r.textContent='验证码已发送。'}function loginAndGo(scan){const phone=document.getElementById('phone')?.value.trim()||'';const code=document.getElementById('code')?.value.trim()||'';const r=document.getElementById('loginResult');if(!scan&&(phone.replace(/\s/g,'')!=='18193185960'||code!=='123456')){r.className='result show bad';r.textContent='手机号或验证码不正确。';return;}window.WenduiAuth.login();r.className='result show ok';r.textContent='登录成功，正在进入。';setTimeout(()=>{location.href=window.WenduiAuth.nextUrl()},180)}</script></body></html>
