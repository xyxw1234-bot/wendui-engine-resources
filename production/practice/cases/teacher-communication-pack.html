<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家校沟通与通知材料包</title><style>
body{margin:0;background:#f7f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.wrap{max-width:1040px;margin:auto;padding:34px 22px}.hero{padding:30px;border-radius:30px;background:linear-gradient(135deg,#eef4ff,#fff);border:1px solid #e4ebf7;box-shadow:0 18px 52px rgba(20,31,54,.07)}h1{font-size:38px;line-height:1.08;margin:8px 0 10px;letter-spacing:-.04em}.lead{font-size:16px;line-height:1.75;color:#5f6b7d;max-width:760px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{background:#fff;border:1px solid #e6ebf4;border-radius:22px;padding:20px;box-shadow:0 12px 34px rgba(20,31,54,.06)}.card b{display:block;font-size:17px;margin-bottom:8px}.card p{margin:0;color:#667085;line-height:1.7}.tag{display:inline-flex;border-radius:999px;background:#eef2ff;color:#3157d5;padding:7px 11px;font-weight:900;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:30px}}
</style></head><body><main class="wrap"><section class="hero"><span class="tag">节点引擎 · 爱马产物示例</span><h1>家校沟通与通知材料包</h1><p class="lead">把口头说明、活动安排、提醒事项整理成家长能看懂、老师能直接发送的通知、问答和跟进清单。</p></section><section class="grid"><div class="card"><b>通知正文</b><p>自动拆成背景、时间、准备物品、注意事项，避免遗漏关键条件。</p></div><div class="card"><b>家长问答</b><p>预判家长可能追问的问题，形成统一回复口径。</p></div><div class="card"><b>跟进清单</b><p>把需要收集的回执、名单、特殊情况标成待办。</p></div><div class="card"><b>可复用模板</b><p>沉淀成下次活动还能继续改的通知模板。</p></div></section></main></body></html>
