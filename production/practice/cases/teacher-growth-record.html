</style></head><body><main class="wrap"><section class="hero"><span class="tag">节点引擎 · 爱马产物示例</span><h1>学生成长观察与谈话记录</h1><p class="lead">把课堂表现、作业变化、谈话要点和家校沟通记录整理成连续的成长证据。</p></section><section class="grid"><div class="card"><b>观察记录</b><p>把零散描述改写成客观、可追踪的行为证据。</p></div><div class="card"><b>原因假设</b><p>提示可能与基础、情绪、习惯、同伴关系有关的线索。</p></div><div class="card"><b>谈话提纲</b><p>生成不贴标签、可沟通的谈话问题。</p></div><div class="card"><b>跟进动作</b><p>形成一周内可执行的小目标和反馈方式。</p></div></section></main></body></html>
