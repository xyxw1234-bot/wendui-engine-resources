<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二次函数闯关小游戏</title><style>body{margin:0;background:#f7f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.wrap{max-width:1020px;margin:auto;padding:32px 22px}.hero,.card{background:#fff;border:1px solid #e6ebf4;border-radius:24px;padding:24px;box-shadow:0 16px 46px rgba(20,31,54,.06)}.hero{background:linear-gradient(135deg,#eef4ff,#fff)}.tag{display:inline-flex;border-radius:999px;background:#ecfdf3;color:#15803d;padding:7px 11px;font-weight:900;font-size:13px}h1{font-size:36px;line-height:1.1;margin:10px 0;letter-spacing:-.04em}p{line-height:1.72;color:#667085}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}.card b{font-size:17px}.card p{margin:8px 0 0}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:29px}}</style></head><body><main class="wrap"><section class="hero"><span class="tag">学生爱马产物示例</span><h1>二次函数闯关小游戏</h1><p>把函数图像判断做成可以玩的三关小游戏，边玩边复习。</p></section><section class="grid"><div class="card"><b>第一关</b><p>判断开口方向和顶点位置。</p></div><div class="card"><b>第二关</b><p>根据表达式选择正确图像。</p></div><div class="card"><b>第三关</b><p>解释图像变化背后的原因。</p></div><div class="card"><b>成果展示</b><p>游戏可以作为学习成果或小组挑战使用。</p></div></section></main></body></html>
