</style></head><body><main class="wrap"><section class="hero"><span class="tag">节点引擎 · 爱马产物示例</span><h1>教研资料速读与观点卡</h1><p class="lead">把政策文件、论文、培训材料变成老师能吸收、能引用、能落地的观点卡。</p></section><section class="grid"><div class="card"><b>三层摘要</b><p>先给一句话结论，再给结构摘要，最后给可落地建议。</p></div><div class="card"><b>可引用句</b><p>提取适合汇报、教研发言、方案写作的表达。</p></div><div class="card"><b>本校转化</b><p>把外部观点转成校本项目或课堂实践建议。</p></div><div class="card"><b>争议提醒</b><p>标出证据不足、概念混用或需要验证的地方。</p></div></section></main></body></html>
