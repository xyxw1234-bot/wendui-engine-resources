<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语文托物言志阅读任务单</title><style>body{margin:0;background:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#172033}.wrap{max-width:920px;margin:auto;padding:32px}.hero,.card{background:white;border:1px solid #e7ebf3;border-radius:22px;padding:24px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tag{display:inline-block;background:#eef2ff;color:#3157d5;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12px}.rubric{display:grid;gap:8px}.rubric div{background:#fbfcff;border:1px solid #e7ebf3;border-radius:14px;padding:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><span class="tag">八年级语文 · 托物言志</span><h1>《白杨礼赞》迁移阅读任务单</h1><p>目标：学生能从“绘形、析神、联人、明志”四步分析托物言志，并完成一段有证据的表达。</p></section><section class="grid"><div class="card"><h2>课堂流程</h2><ol><li>找出描写白杨外形的句子。</li><li>圈画体现精神品质的词语。</li><li>讨论白杨对应的人或群体。</li><li>用一句话说出作者真正想赞美什么。</li></ol></div><div class="card"><h2>学生任务</h2><p>选择一种身边事物，完成“绘形—析神—联人—明志”四格卡片。每格必须引用一个具体细节，不能只写空泛赞美。</p></div></section><section class="card"><h2>评价量表</h2><div class="rubric"><div><b>五星：</b>四步完整，证据具体，物与志自然相连，语言有表现力。</div><div><b>三星：</b>能说明象征意义，但证据偏少，情感表达较普通。</div><div><b>一星：</b>只写事物外形或空泛抒情，看不出“志”。</div></div></section></div><script src="/wendui-engine-resources/assets/auth.js"></script><script src="/wendui-engine-resources/assets/org.js"></script></body></html>
