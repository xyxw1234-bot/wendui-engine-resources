<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的城市昆虫观察小研究</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f6fbf5;color:#132317}.page{max-width:1040px;margin:auto;padding:38px 22px}.hero{border-radius:32px;background:linear-gradient(135deg,#eafff0,#eef6ff);padding:34px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;box-shadow:0 24px 70px rgba(18,77,49,.12)}h1{font-size:42px;line-height:1.05;margin:10px 0}p{line-height:1.8;color:#4b6253}.badge{display:inline-block;background:#dcfce7;color:#15803d;border-radius:999px;padding:8px 12px;font-weight:900}.bug{font-size:120px;text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.card{background:white;border:1px solid #dceee2;border-radius:22px;padding:20px;box-shadow:0 12px 32px rgba(20,80,44,.06)}.card b{display:block;font-size:20px;margin-bottom:8px}.timeline{margin-top:22px;background:#fff;border-radius:24px;padding:22px;border:1px solid #dceee2}.row{display:flex;gap:14px;border-bottom:1px solid #edf5ee;padding:12px 0}.row:last-child{border-bottom:0}.dot{width:34px;height:34px;border-radius:12px;background:#22c55e;color:white;display:grid;place-items:center;font-weight:900;flex:0 0 auto}@media(max-width:760px){.hero,.grid{grid-template-columns:1fr}h1{font-size:32px}.bug{font-size:86px}}</style></head><body><main class="page"><section class="hero"><div><span class="badge">学生小研究</span><h1>我的城市昆虫观察小研究</h1><p>小名用一周时间观察小区、学校和公园里的常见昆虫，把地点、时间、行为和照片线索整理成一份可以展示的小研究。</p></div><div class="bug">🦋🐞</div></section><section class="grid"><article class="card"><b>研究问题</b><p>城市里哪些地方更容易看到昆虫？它们和植物、水源、灯光有什么关系？</p></article><article class="card"><b>观察方法</b><p>每天固定两个时间点记录地点、天气、昆虫数量和行为，不捕捉、不伤害。</p></article><article class="card"><b>我的发现</b><p>傍晚草丛和有花植物附近出现频率最高，雨后第二天观察记录明显增加。</p></article></section><section class="timeline"><h2>观察记录</h2><div class="row"><div class="dot">1</div><p>周一：学校花坛，发现 3 只瓢虫，停留在叶片背面。</p></div><div class="row"><div class="dot">2</div><p>周三：小区路灯旁，飞虫明显增加，记录灯光影响。</p></div><div class="row"><div class="dot">3</div><p>周六：公园水边，观察到蝴蝶和蜜蜂集中在开花植物附近。</p></div></section></main></body></html>
