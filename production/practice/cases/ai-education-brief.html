<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学校 AI 应用教研简报</title><style>body{margin:0;background:#0f172a;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.wrap{max-width:1050px;margin:auto;padding:34px}.hero{padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:linear-gradient(135deg,rgba(49,87,213,.35),rgba(22,169,160,.18))}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px}.num{font-size:36px;font-weight:900;color:#93c5fd}.list{display:grid;gap:10px}.list div{background:rgba(255,255,255,.06);border-radius:14px;padding:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><p>教研简报样例</p><h1>学校 AI 应用从“工具尝鲜”走向“成果生产”</h1><p>本页用于演示：一次教研主题可以被整理为汇报页面、数据卡片、行动建议和成果记录。</p></section><section class="grid"><div class="card"><div class="num">01</div><h2>课堂工具化</h2><p>老师更关心“明天能不能用”，而不是模型参数。</p></div><div class="card"><div class="num">02</div><h2>资源资产化</h2><p>一次生成的材料需要进入学校成果库，而不是沉在聊天记录里。</p></div><div class="card"><div class="num">03</div><h2>教研可视化</h2><p>管理者需要看见哪些资源被生产、复用、迭代。</p></div></section><section class="card"><h2>下一步建议</h2><div class="list"><div>选择 3 个高频教学场景做样板案例。</div><div>为每个案例配置“任务输入—生产过程—成果链接—复用建议”。</div><div>每月把优秀成果沉淀到学校产品成果。</div></div></section></div><script src="/wendui-engine/assets/auth.js"></script><script src="/wendui-engine/assets/org.js"></script></body></html>
