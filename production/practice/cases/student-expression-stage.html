<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表达展示与演讲稿工作台</title><style>

</style></head><body><main class="wrap"><section class="hero"><span class="tag">节点引擎 · 爱马产物示例</span><h1>表达展示与演讲稿工作台</h1><p class="lead">帮学生把观点、故事、证据和情绪组织成能上台展示的表达成果。</p></section><section class="grid"><div class="card"><b>观点主线</b><p>确定我想让别人听完记住什么。</p></div><div class="card"><b>证据材料</b><p>把观察、数据、照片、访谈变成支撑。</p></div><div class="card"><b>表达脚本</b><p>生成开场、转折、收束和互动提问。</p></div><div class="card"><b>彩排反馈</b><p>根据时长、清晰度和感染力给修改建议。</p></div></section></main></body></html>
