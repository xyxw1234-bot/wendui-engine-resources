</style></head><body><main class="wrap"><section class="hero"><span class="tag">节点引擎 · 爱马产物示例</span><h1>教师一周工作编排表</h1><p class="lead">把备课、批改、会议、沟通、材料提交和个人事项排成可执行的周计划。</p></section><section class="grid"><div class="card"><b>任务归类</b><p>区分马上做、可批量处理、需要等待他人反馈的任务。</p></div><div class="card"><b>时间块安排</b><p>把碎片事项放入合适时间段，减少临时混乱。</p></div><div class="card"><b>风险提醒</b><p>标出容易延期或遗漏的节点。</p></div><div class="card"><b>每日收口</b><p>每天结束时自动生成次日优先动作。</p></div></section></main></body></html>
