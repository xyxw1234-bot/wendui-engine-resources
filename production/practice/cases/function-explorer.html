<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>函数图像互动探究工具</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;margin:0;background:#f7f8fb;color:#172033}.wrap{max-width:980px;margin:auto;padding:28px}canvas{width:100%;height:360px;background:white;border:1px solid #dfe5ef;border-radius:18px}.panel{background:white;border:1px solid #e7ebf3;border-radius:18px;padding:18px;margin-top:16px}.row{display:grid;grid-template-columns:120px 1fr 70px;gap:12px;align-items:center;margin:10px 0}input{width:100%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fbfcff;border:1px solid #e7ebf3;border-radius:16px;padding:14px}@media(max-width:700px){.cards{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>函数图像互动探究工具</h1><p>拖动参数，观察 y = ax² + bx + c 的开口、顶点和截距变化。用于九年级函数图像课堂导入与小组探究。</p><canvas id="draw" width="900" height="360"></canvas><div class="panel"><div class="row"><b>a 开口系数</b><input id="a" type="range" min="-3" max="3" step="0.1" value="1"><span id="av"></span></div><div class="row"><b>b 平移系数</b><input id="b" type="range" min="-6" max="6" step="0.1" value="0"><span id="bv"></span></div><div class="row"><b>c 截距</b><input id="c" type="range" min="-8" max="8" step="0.1" value="0"><span id="cvv"></span></div></div><div class="cards"><div class="card"><b>观察任务 1</b><p>a 从正变负，图像发生什么变化？</p></div><div class="card"><b>观察任务 2</b><p>b 改变时，顶点是否只左右移动？</p></div><div class="card"><b>观察任务 3</b><p>c 与 y 轴交点有什么关系？</p></div></div></div><script>const canvas=document.getElementById('draw'),ctx=canvas.getContext('2d');function val(id){return parseFloat(document.getElementById(id).value)}function draw(){const a=val('a'),b=val('b'),c=val('c');av.textContent=a.toFixed(1);bv.textContent=b.toFixed(1);cvv.textContent=c.toFixed(1);ctx.clearRect(0,0,900,360);ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;for(let x=0;x<=900;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,360);ctx.stroke()}for(let y=0;y<=360;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}ctx.strokeStyle='#111827';ctx.beginPath();ctx.moveTo(0,180);ctx.lineTo(900,180);ctx.moveTo(450,0);ctx.lineTo(450,360);ctx.stroke();ctx.strokeStyle='#3157d5';ctx.lineWidth=3;ctx.beginPath();let first=true;for(let px=0;px<=900;px++){let x=(px-450)/45;let y=a*x*x+b*x+c;let py=180-y*22;if(first){ctx.moveTo(px,py);first=false}else ctx.lineTo(px,py)}ctx.stroke();ctx.fillStyle='#172033';ctx.font='16px sans-serif';ctx.fillText(`y = ${a.toFixed(1)}x² + ${b.toFixed(1)}x + ${c.toFixed(1)}`,20,30)}['a','b','c'].forEach(id=>document.getElementById(id).addEventListener('input',draw));draw()</script><script src="/wendui-engine-resources/assets/auth.js"></script><script src="/wendui-engine-resources/assets/org.js"></script></body></html>
