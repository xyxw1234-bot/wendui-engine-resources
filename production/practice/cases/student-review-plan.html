<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>期末前一周复习计划</title><style>body{margin:0;background:#f7f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.wrap{max-width:1020px;margin:auto;padding:32px 22px}.hero,.card{background:#fff;border:1px solid #e6ebf4;border-radius:24px;padding:24px;box-shadow:0 16px 46px rgba(20,31,54,.06)}.hero{background:linear-gradient(135deg,#ecfeff,#fff)}.tag{display:inline-flex;border-radius:999px;background:#ecfdf3;color:#15803d;padding:7px 11px;font-weight:900;font-size:13px}h1{font-size:36px;line-height:1.1;margin:10px 0;letter-spacing:-.04em}p{line-height:1.72;color:#667085}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}.card b{font-size:17px}.card p{margin:8px 0 0}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:29px}}</style></head><body><main class="wrap"><section class="hero"><span class="tag">学生爱马产物示例</span><h1>期末前一周复习计划</h1><p>把临近考试的焦虑变成每天能执行的清单，而不是空泛鼓励。</p></section><section class="grid"><div class="card"><b>薄弱排序</b><p>先判断最该补的章节和题型。</p></div><div class="card"><b>每日任务</b><p>每天安排少量但明确的复习动作。</p></div><div class="card"><b>错题回看</b><p>把旧错题改成新的检查题。</p></div><div class="card"><b>动态调整</b><p>根据完成情况调整后两天任务。</p></div></section></main></body></html>
