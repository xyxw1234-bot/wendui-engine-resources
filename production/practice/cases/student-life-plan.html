body{margin:0;background:#f7f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.wrap{max-width:1040px;margin:auto;padding:34px 22px}.hero{padding:30px;border-radius:30px;background:linear-gradient(135deg,#ecfeff,#fff);border:1px solid #e4ebf7;box-shadow:0 18px 52px rgba(20,31,54,.07)}h1{font-size:38px;line-height:1.08;margin:8px 0 10px;letter-spacing:-.04em}.lead{font-size:16px;line-height:1.75;color:#5f6b7d;max-width:760px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{background:#fff;border:1px solid #e6ebf4;border-radius:22px;padding:20px;box-shadow:0 12px 34px rgba(20,31,54,.06)}.card b{display:block;font-size:17px;margin-bottom:8px}.card p{margin:0;color:#667085;line-height:1.7}.tag{display:inline-flex;border-radius:999px;background:#eef2ff;color:#3157d5;padding:7px 11px;font-weight:900;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:30px}}
</style></head><body><main class="wrap"><section class="hero"><span class="tag">节点引擎 · 爱马产物示例</span><h1>个人计划与成长记录</h1><p class="lead">不只是学习计划，也可以整理阅读、运动、兴趣、比赛准备和自我管理。</p></section><section class="grid"><div class="card"><b>目标拆解</b><p>把一个月目标拆成每周/每天能做到的小动作。</p></div><div class="card"><b>习惯追踪</b><p>用简单记录看见自己有没有坚持。</p></div><div class="card"><b>反思问题</b><p>每天用 2-3 个问题复盘，而不是写流水账。</p></div><div class="card"><b>成长证据</b><p>把计划、产品成果、反馈、照片沉淀成个人成长材料。</p></div></section></main></body></html>
