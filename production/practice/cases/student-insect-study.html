<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市昆虫观察小研究</title><style>body{margin:0;background:#f7f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.wrap{max-width:1020px;margin:auto;padding:32px 22px}.hero,.card{background:#fff;border:1px solid #e6ebf4;border-radius:24px;padding:24px;box-shadow:0 16px 46px rgba(20,31,54,.06)}.hero{background:linear-gradient(135deg,#fff7ed,#fff)}.tag{display:inline-flex;border-radius:999px;background:#ecfdf3;color:#15803d;padding:7px 11px;font-weight:900;font-size:13px}h1{font-size:36px;line-height:1.1;margin:10px 0;letter-spacing:-.04em}p{line-height:1.72;color:#667085}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}.card b{font-size:17px}.card p{margin:8px 0 0}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:29px}}</style></head><body><main class="wrap"><section class="hero"><span class="tag">学生爱马产物示例</span><h1>城市昆虫观察小研究</h1><p>把观察记录、照片、地点、时间和发现整理成可展示的小研究页面。</p></section><section class="grid"><div class="card"><b>观察问题</b><p>我想知道城市里哪些角落更容易发现昆虫。</p></div><div class="card"><b>证据记录</b><p>记录时间、地点、天气、昆虫特征和照片说明。</p></div><div class="card"><b>发现整理</b><p>把观察转成图表、结论和新的问题。</p></div><div class="card"><b>展示反思</b><p>说明我下一次会如何改进观察方法。</p></div></section></main></body></html>
