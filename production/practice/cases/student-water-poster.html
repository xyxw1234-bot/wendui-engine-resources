<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园节水倡议海报页</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#eef9ff;color:#102033}.poster{max-width:980px;margin:30px auto;padding:24px}.hero{background:linear-gradient(135deg,#0ea5e9,#22c55e);color:white;border-radius:36px;padding:42px;box-shadow:0 28px 80px rgba(14,165,233,.22)}h1{font-size:48px;line-height:1;margin:10px 0}.hero p{font-size:18px;line-height:1.8;max-width:720px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.card{background:white;border-radius:24px;padding:22px;border:1px solid #d9edf8;box-shadow:0 12px 36px rgba(16,80,120,.08)}.card h2{margin-top:0;color:#0369a1}.big{font-size:54px;font-weight:950;color:#0ea5e9}.steps{display:grid;gap:12px}.step{display:flex;gap:12px;align-items:flex-start}.num{width:34px;height:34px;border-radius:12px;background:#dcfce7;color:#15803d;display:grid;place-items:center;font-weight:950;flex:0 0 auto}.slogan{text-align:center;background:#fff;border-radius:26px;padding:24px;margin-top:20px;font-size:30px;font-weight:950;color:#0369a1}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:34px}.slogan{font-size:24px}}</style></head><body><main class="poster"><section class="hero"><span>学生项目海报</span><h1>让每一滴水都被看见</h1><p>小名把校园节水倡议做成一页海报：先呈现观察到的问题，再给出可以马上执行的行动建议。</p></section><section class="grid"><article class="card"><h2>调查发现</h2><div class="big">27%</div><p>课间洗手池存在未及时关水或水流过大的情况，最常出现在午饭前后。</p></article><article class="card"><h2>行动建议</h2><div class="steps"><div class="step"><div class="num">1</div><p>在洗手池旁贴上“关小一点，也是一点改变”。</p></div><div class="step"><div class="num">2</div><p>设置班级节水观察员，每周记录一次。</p></div><div class="step"><div class="num">3</div><p>把节水数据做成月度榜单，鼓励持续行动。</p></div></div></article></section><div class="slogan">今天少浪费一滴，明天多留一片蓝。</div></main></body></html>
