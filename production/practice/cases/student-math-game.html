<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二次函数闯关小游戏</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f7f8ff;color:#172033}.wrap{max-width:1050px;margin:auto;padding:38px 22px}.hero{background:linear-gradient(135deg,#eef2ff,#fff7ed);border-radius:32px;padding:34px;box-shadow:0 24px 70px rgba(49,87,213,.14)}h1{font-size:42px;line-height:1.05;margin:8px 0}.badge{display:inline-block;border-radius:999px;background:#eef2ff;color:#3157d5;padding:8px 12px;font-weight:900}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.level{background:#fff;border:1px solid #e1e7f5;border-radius:24px;padding:22px;position:relative;overflow:hidden}.level:after{content:"";position:absolute;right:-30px;bottom:-30px;width:100px;height:100px;border-radius:50%;background:rgba(49,87,213,.08)}.level h2{margin:0 0 10px}.formula{font-size:24px;font-weight:950;color:#3157d5}.btn{display:inline-block;margin-top:12px;background:#3157d5;color:#fff;border-radius:999px;padding:10px 14px;font-weight:900}.board{margin-top:24px;background:#0f172a;color:#e2e8f0;border-radius:26px;padding:22px}.axis{height:220px;background:linear-gradient(#1e293b 1px,transparent 1px),linear-gradient(90deg,#1e293b 1px,transparent 1px);background-size:28px 28px;border-radius:18px;position:relative}.curve{position:absolute;left:22%;top:18%;width:56%;height:70%;border:6px solid #38bdf8;border-top:0;border-radius:0 0 50% 50%;transform:rotate(180deg)}@media(max-width:760px){.levels{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">学生互动工具</span><h1>二次函数闯关小游戏</h1><p>把二次函数图像判断做成三关挑战：看开口、找顶点、判断交点。小名可以用它复习，也可以给同学出题。</p></section><section class="levels"><article class="level"><h2>第一关：看开口</h2><p class="formula">y = ax²</p><p>a 大于 0 向上，小于 0 向下。</p><span class="btn">已通关</span></article><article class="level"><h2>第二关：找顶点</h2><p class="formula">y = a(x-h)²+k</p><p>顶点藏在 h 和 k 里。</p><span class="btn">挑战中</span></article><article class="level"><h2>第三关：判交点</h2><p class="formula">y = ax²+bx+c</p><p>c 决定和 y 轴在哪里见面。</p><span class="btn">待解锁</span></article></section><section class="board"><h2>图像观察板</h2><div class="axis"><div class="curve"></div></div></section></main></body></html>
